services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sn_generator_api
    restart: unless-stopped
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CORS_ALLOWED_ORIGINS=http://localhost:8080
      - MAX_EXCEL_UPLOAD_BYTES=20971520
      - MAX_EXCEL_UNCOMPRESSED_BYTES=104857600
    volumes:
      - ./backend/data:/app/backend/data
    networks:
      - sn_net

  nginx:
    image: nginx:1.27-alpine
    container_name: sn_generator_nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./styles:/usr/share/nginx/html/styles:ro
      - ./js:/usr/share/nginx/html/js:ro
    networks:
      - sn_net

networks:
  sn_net:
    name: sn_generator_network
